<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三道军令 · 谋定山河</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1d201c;color:#efdfbc;font:15px/1.5 "Songti SC","Noto Serif CJK SC",serif}
main{max-width:430px;margin:auto;padding:12px 12px 20px;background:#29271f}header,footer{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#cfbd99;font-size:13px}
h1{margin:4px 0 10px;text-align:center;font-size:28px;letter-spacing:.18em}canvas{width:100%;display:block;border:1px solid #8f724c;touch-action:none}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
button{border:1px solid #967b55;background:#443426;color:#f5e1b7;min-height:44px;padding:5px 8px;font:inherit;cursor:pointer}
nav button{min-width:0;padding:8px 2px}button[aria-pressed=true],#confirm{background:#793827;border-color:#d5a35b}button:disabled{opacity:.48;cursor:default}
b,small{display:block}b{font-size:16px}small{font-size:11px;color:#ddc79d}section{min-height:60px;padding:1px 0 8px}p{margin:8px 0}ul{margin:0;padding-left:20px}
</style>
<script type="module" src="/strategy-trial.js"></script>
</html>
